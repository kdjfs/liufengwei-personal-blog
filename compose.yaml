name: lfw-space

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_ROOT_PASSWORD: ${LFW_MYSQL_ROOT_PASSWORD:-lfw_root_local_only}
      MYSQL_DATABASE: ${LFW_MYSQL_DATABASE:-lfw_space}
      MYSQL_USER: lfw
      MYSQL_PASSWORD: ${LFW_MYSQL_PASSWORD:-lfw_local_only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '127.0.0.1:${LFW_MYSQL_PORT:-3307}:3306'
    volumes:
      - lfw_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -ulfw -p$${MYSQL_PASSWORD} --silent']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8.6.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${LFW_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  lfw_mysql_data:
