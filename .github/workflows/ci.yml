name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: lfw_root_test_only
          MYSQL_DATABASE: lfw_test
          MYSQL_USER: lfw
          MYSQL_PASSWORD: lfw_test_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ulfw -plfw_test_only --silent"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:8.6.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full-stack checks
        run: pnpm fullstack:check

      - name: Run MySQL and Redis integration tests
        env:
          LFW_TEST_DATABASE_URL: mysql://lfw:lfw_test_only@127.0.0.1:3307/lfw_test
          LFW_TEST_REDIS_URL: redis://127.0.0.1:6380/0
        run: pnpm test:integration

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release gate
        run: pnpm release:check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
